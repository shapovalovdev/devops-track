  - 🟡 Текущий спринт (Пак 02):
      - Обзор спринта: pack-02/index.md
      - Задачи: pack-02/tasks.md
      - Чеклист: pack-02/checklist.md
      - Почему всё так: pack-02/fundamentals.md
      - Теория: pack-02/theory.md
      - Самопроверка: pack-02/rubric.md
      - Вопросы с собеседований: pack-02/questions.md
      - Материалы: pack-02/materials.md
      - Банк вопросов: pack-02/bank.md
  - 🟢 Архив (Пак 01):
      - Обзор спринта: pack-01/index.md
      - Задачи: pack-01/tasks.md
      - Чеклист: pack-01/checklist.md
      - Почему всё так: pack-01/fundamentals.md
      - Теория: pack-01/theory.md
      - Самопроверка: pack-01/rubric.md
      - Вопросы с собеседований: pack-01/questions.md
      - Материалы: pack-01/materials.md
      - Банк вопросов: pack-01/bank.md
  - ⚪ План на сентябрь (Пак 03):
      - Обзор спринта: pack-03/index.md
      - Задачи: pack-03/tasks.md
      - Чеклист: pack-03/checklist.md
      - Почему всё так: pack-03/fundamentals.md
      - Теория: pack-03/theory.md
      - Самопроверка: pack-03/rubric.md
      - Вопросы с собеседований: pack-03/questions.md
