site_name: DevOps Track
site_description: Материалы паков — от поддержки к DevOps/SRE
site_url: https://shapovalovdev.github.io/devops-track/

# Issue #20: unlisted, never linked, not indexed. This is not access control —
# GitHub Pages serves to anyone with the URL — it only reduces discoverability.
site_author: ""
copyright: ""

docs_dir: docs
site_dir: _build

theme:
  name: material
  custom_dir: overrides   # adds the noindex meta tag to every page — see overrides/main.html
  language: ru
  font: false          # no Google Fonts request; system stacks render Cyrillic fine
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

extra:
  alternate:
    - name: Русский
      link: /devops-track/
      lang: ru
    - name: English
      link: /devops-track/en/
      lang: en

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
